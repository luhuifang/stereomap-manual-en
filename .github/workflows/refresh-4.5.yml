name: Refresh optimized 4.5 manual

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/refresh-4.5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-optimized-manual-4-5
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and publish 4.5
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out optimized branch
        uses: actions/checkout@v4
        with:
          ref: "4.5"
          fetch-depth: 0

      - name: Resolve immutable source and target commits
        id: refs
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/4.5:refs/remotes/origin/4.5"

          test "$(git branch --show-current)" = "4.5"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Source $SOURCE_SHA is not part of origin/main" >&2
            exit 1
          fi

          target_base="$(git rev-parse HEAD)"
          remote_target="$(git rev-parse origin/4.5)"
          if [[ "$target_base" != "$remote_target" ]]; then
            echo "Checked-out 4.5 is stale: local=$target_base remote=$remote_target" >&2
            exit 1
          fi

          git push --dry-run origin HEAD:refs/heads/4.5

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_short=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "target_base=$target_base" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-avif.txt

      - name: Install AVIF tooling
        run: python -m pip install -r tools/requirements-avif.txt

      - name: Regenerate and validate optimized docs
        id: refresh
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.refs.outputs.source_sha }}
        run: |
          set -euo pipefail
          python tools/refresh_manual_avif.py \
            --source-ref "$SOURCE_SHA" \
            --target-branch "4.5" \
            --staging-root "$RUNNER_TEMP/manual-refresh"

          git diff --check
          if ! git diff --quiet -- . ":(exclude)docs/**"; then
            echo "Refresh changed files outside docs/:" >&2
            git diff --name-only -- . ":(exclude)docs/**" >&2
            exit 1
          fi

          unexpected_untracked="$(
            git ls-files --others --exclude-standard -- . ":(exclude)docs/**"
          )"
          if [[ -n "$unexpected_untracked" ]]; then
            echo "Refresh created unexpected untracked files:" >&2
            echo "$unexpected_untracked" >&2
            exit 1
          fi

          docs_status="$(git status --porcelain=v1 --untracked-files=all -- docs)"
          if [[ -z "$docs_status" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Optimized 4.5 already matches main $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Optimized 4.5 will be updated from main $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
            echo "$docs_status"
          fi

      - name: Commit and publish optimized docs
        if: steps.refresh.outputs.changed == 'true'
        shell: bash
        env:
          SOURCE_SHORT: ${{ steps.refs.outputs.source_short }}
          TARGET_BASE: ${{ steps.refs.outputs.target_base }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs
          git diff --cached --check
          git commit -m "manual: auto-refresh 4.5 from main $SOURCE_SHORT"

          git fetch --no-tags origin \
            "+refs/heads/4.5:refs/remotes/origin/4.5"
          remote_target="$(git rev-parse origin/4.5)"
          if [[ "$remote_target" != "$TARGET_BASE" ]]; then
            echo "Refusing to overwrite concurrent 4.5 update: expected=$TARGET_BASE actual=$remote_target" >&2
            exit 1
          fi

          git push origin HEAD:refs/heads/4.5
          echo "Published 4.5 commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
